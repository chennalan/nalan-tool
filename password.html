<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小陈轻量级网页密码管理器 | 安全本地存储</title>
    <link rel="stylesheet" type="text/css" href="./css/FiraCode.css">
    <link rel="icon" href="./favicon.ico">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Fira Code', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 {
            color: #58a6ff;
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* 主密码输入面板 */
        .master-panel {
            background: #0d1117;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #21262d;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        /* 搜索与工具栏 */
        .search-panel {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* 统一输入框与按钮样式 */
        input {
            background: #0d1117;
            border: 1px solid #30363d;
            color: #58a6ff;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            width: 100%;
        }

        input:focus {
            border-color: #58a6ff;
        }

        button {
            background: #238636;
            color: #ffffff;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }

        button:hover {
            background: #2ea043;
        }

        button.btn-danger {
            background: #da3633;
        }
        button.btn-danger:hover {
            background: #f85149;
        }

        button.btn-secondary {
            background: #21262d;
            border: 1px solid #30363d;
        }
        button.btn-secondary:hover {
            background: #30363d;
        }

        /* 添加密码表单 */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 25px;
        }

        /* 密码列表表格 */
        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #21262d;
            font-size: 14px;
        }

        th {
            color: #8b949e;
            background: #0d1117;
        }

        .pwd-field {
            font-family: monospace;
            letter-spacing: 2px;
        }

        .action-btns {
            display: flex;
            gap: 6px;
        }

        .notice {
            font-size: 12px;
            color: #8b949e;
            margin-top: 15px;
            text-align: center;
        }

        @media (max-width: 650px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .master-panel, .search-panel {
                flex-direction: column;
            }
        }
    </style>

<link rel="stylesheet" href="css/dark-mode.css">
<script src="js/dark-mode.js" defer></script>
</head>
<body>

<div class="container">
    <h1>🔑 小陈密码管理器 (采用AES-256 本地加密)</h1>

    <!-- 主密码解锁层 -->
    <div class="master-panel">
        <input type="password" id="masterKey" placeholder="输入你的主解密密钥 (Master Key)" autocomplete="off">
        <button onclick="unlockVault()">解锁 / 加载</button>
    </div>

    <!-- 🔍 实时搜索栏与导入导出操作栏 -->
    <div class="search-panel">
        <input type="text" id="searchInput" placeholder="🔍 搜索平台名称、账号..." autocomplete="off" oninput="renderVault()" style="flex: 1;">
        <button class="btn-secondary" onclick="clearSearch()">✖ 清空</button>
        <button class="btn-secondary" onclick="exportJSON()">📥 导出备份</button>
        <button class="btn-secondary" onclick="document.getElementById('importFile').click()">📤 导入备份</button>
        <!-- 隐藏的文件选择 input -->
        <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importJSON(event)">
    </div>

    <!-- 新建密码表单 -->
    <div class="form-grid">
        <input type="text" id="siteName" placeholder="网站 / 平台名称" autocomplete="off">
        <input type="text" id="username" placeholder="账号 / 邮箱" autocomplete="off">
        <input type="text" id="password" placeholder="密码" autocomplete="off">
        <button onclick="addEntry()">➕ 保存记录</button>
    </div>

    <!-- 密码列表显示 -->
    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>平台</th>
                    <th>账号</th>
                    <th>密码</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody id="vaultTable">
                <tr>
                    <td colspan="4" style="text-align: center; color: #8b949e;">请先输入主密钥并点击“解锁”</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="notice">
        🔒 所有数据均通过 Web Crypto API 在本地加密存储。支持导出 JSON 备份防止清理缓存丢失。
    </div>
</div>

<script>
    let cryptoKey = null;

    // 1. 根据主密钥派生加密 Key (PBKDF2)
    async function getKey(masterPassword) {
        const enc = new TextEncoder();
        const keyMaterial = await crypto.subtle.importKey(
            "raw", enc.encode(masterPassword), "PBKDF2", false, ["deriveKey"]
        );
        return crypto.subtle.deriveKey(
            {
                name: "PBKDF2",
                salt: enc.encode("fixed_salt_for_local_vault"),
                iterations: 100000,
                hash: "SHA-256"
            },
            keyMaterial,
            { name: "AES-GCM", length: 256 },
            false,
            ["encrypt", "decrypt"]
        );
    }

    // 2. 加密函数
    async function encryptData(text) {
        if (!cryptoKey) return null;
        const enc = new TextEncoder();
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const encrypted = await crypto.subtle.encrypt(
            { name: "AES-GCM", iv: iv },
            cryptoKey,
            enc.encode(text)
        );
        return {
            iv: Array.from(iv),
            data: Array.from(new Uint8Array(encrypted))
        };
    }

    // 3. 解密函数
    async function decryptData(encryptedObj) {
        if (!cryptoKey) return null;
        try {
            const iv = new Uint8Array(encryptedObj.iv);
            const data = new Uint8Array(encryptedObj.data);
            const decrypted = await crypto.subtle.decrypt(
                { name: "AES-GCM", iv: iv },
                cryptoKey,
                data
            );
            return new TextDecoder().decode(decrypted);
        } catch (e) {
            return null;
        }
    }

    // 解锁并读取列表
    async function unlockVault() {
        const masterPw = document.getElementById('masterKey').value;
        if (!masterPw) {
            alert('请输入主密钥！');
            return;
        }
        cryptoKey = await getKey(masterPw);
        await renderVault();
    }

    // 清空搜索框
    function clearSearch() {
        document.getElementById('searchInput').value = '';
        renderVault();
    }

    // 添加新条目
    async function addEntry() {
        if (!cryptoKey) {
            alert('请先解锁密码库！');
            return;
        }
        const site = document.getElementById('siteName').value;
        const user = document.getElementById('username').value;
        const pwd = document.getElementById('password').value;

        if (!site || !pwd) {
            alert('请至少填写网站和密码！');
            return;
        }

        const encryptedSite = await encryptData(site);
        const encryptedUser = await encryptData(user);
        const encryptedPwd = await encryptData(pwd);

        const vault = JSON.parse(localStorage.getItem('my_vault') || '[]');
        vault.push({ id: Date.now(), site: encryptedSite, user: encryptedUser, pwd: encryptedPwd });
        localStorage.setItem('my_vault', JSON.stringify(vault));

        document.getElementById('siteName').value = '';
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';

        await renderVault();
    }

    // 删除条目
    async function deleteEntry(id) {
        let vault = JSON.parse(localStorage.getItem('my_vault') || '[]');
        vault = vault.filter(item => item.id !== id);
        localStorage.setItem('my_vault', JSON.stringify(vault));
        await renderVault();
    }

    // 📥 导出 JSON 备份
    function exportJSON() {
        const vault = localStorage.getItem('my_vault');
        if (!vault || JSON.parse(vault).length === 0) {
            alert('当前没有可导出的数据！');
            return;
        }
        const blob = new Blob([vault], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const dateStr = new Date().toISOString().slice(0, 10);
        a.href = url;
        a.download = `password_backup_${dateStr}.json`;
        a.click();
        URL.revokeObjectURL(url);
    }

    // 📤 导入 JSON 备份
    function importJSON(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (!Array.isArray(importedData)) {
                    alert('导入的文件格式不正确！');
                    return;
                }

                let currentVault = JSON.parse(localStorage.getItem('my_vault') || '[]');
                
                // 简单的防重复添加判断（按 id 查重）
                const existingIds = new Set(currentVault.map(item => item.id));
                let newEntriesCount = 0;

                importedData.forEach(item => {
                    if (item.id && item.site && item.pwd && !existingIds.has(item.id)) {
                        currentVault.push(item);
                        newEntriesCount++;
                    }
                });

                localStorage.setItem('my_vault', JSON.stringify(currentVault));
                alert(`成功导入 ${newEntriesCount} 条新密码记录！`);
                
                if (cryptoKey) {
                    await renderVault();
                } else {
                    alert('请解密查看导入的数据。');
                }
            } catch (err) {
                alert('解析备份文件失败，请确保选择的是正确的密码备份 JSON 文件！');
            }
        };
        reader.readAsText(file);
        // 清空 input 值方便重复选取同名文件
        event.target.value = '';
    }

    // 渲染密码表格
    async function renderVault() {
        if (!cryptoKey) return;

        const tbody = document.getElementById('vaultTable');
        const searchKeyword = document.getElementById('searchInput').value.trim().toLowerCase();
        const vault = JSON.parse(localStorage.getItem('my_vault') || '[]');
        tbody.innerHTML = '';

        if (vault.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #8b949e;">密码库为空</td></tr>`;
            return;
        }

        let matchCount = 0;

        for (const item of vault) {
            const site = await decryptData(item.site);
            const user = await decryptData(item.user);
            const pwd = await decryptData(item.pwd);

            if (site === null) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #ff3366;">主密钥错误，无法解密数据！</td></tr>`;
                return;
            }

            // 搜索匹配过滤
            if (searchKeyword && 
                !site.toLowerCase().includes(searchKeyword) && 
                !(user && user.toLowerCase().includes(searchKeyword))) {
                continue;
            }

            matchCount++;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${escapeHtml(site)}</strong></td>
                <td>${escapeHtml(user || '-')}</td>
                <td>
                    <span class="pwd-field" id="pwd-${item.id}">••••••••</span>
                </td>
                <td class="action-btns">
                    <button class="btn-secondary" onclick="togglePwd('${item.id}', '${escapeJs(pwd)}')">👁️ 显示</button>
                    <button class="btn-secondary" onclick="copyText('${escapeJs(pwd)}')">📋 复制</button>
                    <button class="btn-danger" onclick="deleteEntry(${item.id})">🗑️ 删除</button>
                </td>
            `;
            tbody.appendChild(tr);
        }

        if (matchCount === 0 && searchKeyword) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #8b949e;">未找到匹配 "${escapeHtml(searchKeyword)}" 的记录</td></tr>`;
        }
    }

    // 显示/隐藏密码
    function togglePwd(id, realPwd) {
        const el = document.getElementById(`pwd-${id}`);
        if (el.innerText === '••••••••') {
            el.innerText = realPwd;
        } else {
            el.innerText = '••••••••';
        }
    }

    // 复制剪贴板
    function copyText(text) {
        navigator.clipboard.writeText(text);
        alert('密码已复制到剪贴板！');
    }

    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
    }

    function escapeJs(str) {
        return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
    }
</script>
</body>
</html>
