<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - SYSTEM ERROR | 赵姑娘</title>
    <link rel="stylesheet" type="text/css" href="./css/FiraCode.css">
    <link rel="icon" href="./favicon.ico">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Fira Code', Consolas, Monaco, 'Courier New', monospace;
        }

        body {
            background-color: #0d0f12;
            color: #00ff66;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            padding: 20px;
        }

        /* 扫描线背景效果 */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* 核心卡片容器 */
        .container {
            width: 100%;
            max-width: 680px;
            background: rgba(15, 20, 25, 0.9);
            border: 1px solid #1f293d;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 15px rgba(0, 255, 102, 0.1);
            overflow: hidden;
            z-index: 3;
        }

        /* 终端顶部栏 */
        .terminal-header {
            background: #161b22;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #21262d;
        }

        .buttons {
            display: flex;
            gap: 8px;
        }

        .btn-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .red { background: #ff5f56; }
        .yellow { background: #ffbd2e; }
        .green { background: #27c93f; }

        .title {
            color: #8b949e;
            font-size: 13px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 终端主体内容 */
        .terminal-body {
            padding: 25px;
            font-size: 14px;
            line-height: 1.6;
        }

        /* Glitch 故障效果标题 */
        .glitch {
            font-size: 64px;
            font-weight: bold;
            color: #ff3366;
            text-shadow: 2px 2px #00ffff;
            position: relative;
            margin-bottom: 10px;
            animation: glitch-anim 2s infinite alternate;
        }

        @keyframes glitch-anim {
            0% { text-shadow: 2px 2px #00ffff, -2px -2px #ff0055; }
            25% { text-shadow: -2px 2px #00ffff, 2px -2px #ff0055; }
            50% { text-shadow: 2px -2px #00ffff, -2px 2px #ff0055; }
            75% { text-shadow: -2px -2px #00ffff, 2px 2px #ff0055; }
            100% { text-shadow: 2px 2px #00ffff, -2px -2px #ff0055; }
        }

        .path-info {
            color: #e6edf3;
            margin-bottom: 15px;
        }

        .highlight {
            color: #ffaa00;
        }

        .cmd-line {
            margin-top: 10px;
            color: #8b949e;
        }

        .prompt {
            color: #00ff66;
        }

        /* 交互按钮 */
        .actions {
            margin-top: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-block;
            padding: 10px 20px;
            background: transparent;
            color: #00ff66;
            border: 1px solid #00ff66;
            border-radius: 4px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #00ff66;
            color: #0d0f12;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }

        .btn-secondary {
            color: #8b949e;
            border-color: #30363d;
        }

        .btn-secondary:hover {
            background: #30363d;
            color: #ffffff;
            box-shadow: none;
        }

        /* 响应式调整 */
        @media (max-width: 600px) {
            .glitch { font-size: 48px; }
            .terminal-body { padding: 15px; }
            .actions { flex-direction: column; }
            .btn { text-align: center; }
        }
    </style>

<link rel="stylesheet" href="css/dark-mode.css">
<script src="js/dark-mode.js" defer></script>
</head>
<body>

    <div class="container">
        <!-- 终端头部 -->
        <div class="terminal-header">
            <div class="buttons">
                <div class="btn-dot red"></div>
                <div class="btn-dot yellow"></div>
                <div class="btn-dot green"></div>
            </div>
            <div class="title">bash - 404_NOT_FOUND</div>
        </div>

        <!-- 终端内容 -->
        <div class="terminal-body">
            <div class="glitch">404</div>
            <div class="path-info">
                [<span class="highlight">ERROR</span>] 目标路径不存在或已被删除。
            </div>

            <div class="cmd-line">
                <span class="prompt">root@nutssss</span>:<span style="color:#58a6ff;">~</span># ./diagnose.sh<br/>
                > 正在扫描系统路径... <span style="color:#ff3366;">[FAILED]</span><br/>
                > 试图寻回丢失的数据块... <span style="color:#ffaa00;">[TIMEOUT]</span><br/>
                > 状态: 页面已坠入虚无网络空隙。
            </div>

            <!-- 导航按钮 -->
            <div class="actions">
                <a href="./index.html" class="btn">🚀 返回主页 (cd ~)</a>
                <a href="javascript:history.back()" class="btn btn-secondary">↩️ 返回上一页</a>
            </div>
        </div>
    </div>

</body>
</html>
