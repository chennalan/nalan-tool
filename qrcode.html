<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二维码生成器</title>
    <!-- Tailwind CSS 样式库 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode.js 二维码生成库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<link rel="stylesheet" href="css/dark-mode.css">
<script src="js/dark-mode.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- 顶栏 -->
    <header class="bg-white border-b border-slate-200 py-4 px-6 shadow-sm flex justify-between items-center">
        <div class="flex items-center space-x-2">
            <span class="text-2xl">📱</span>
            <h1 class="text-xl font-bold text-slate-900">二维码在线生成器</h1>
        </div>
        <span class="text-xs bg-indigo-100 text-indigo-700 px-2.5 py-1 rounded-full font-medium">即实时生成 · 离线安全</span>
    </header>

    <!-- 主内容区 -->
    <main class="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- 左侧：控制面板 -->
        <div class="lg:col-span-1 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-6">
            
            <!-- 1. 内容输入 -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">1. 输入文本或网址</label>
                <textarea id="qrText" rows="4" placeholder="在此输入网址 (例如 https://example.com) 或任意文本..." class="w-full p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition resize-none">https://google.com</textarea>
            </div>

            <!-- 2. 外观自定义 -->
            <div class="space-y-4">
                <label class="block text-sm font-semibold text-slate-700">2. 自定义样式</label>
                
                <!-- 尺寸设置 -->
                <div class="space-y-1 text-xs">
                    <div class="flex justify-between text-slate-500">
                        <span>分辨率大小</span>
                        <span id="valSize">256 x 256 px</span>
                    </div>
                    <input type="range" id="sizeSlider" min="128" max="512" step="32" value="256" class="w-full accent-indigo-600">
                </div>

                <!-- 颜色调色板 -->
                <div class="grid grid-cols-2 gap-3 text-xs">
                    <div class="space-y-1">
                        <span class="text-slate-500 block">前景色 (前码)</span>
                        <div class="flex items-center space-x-2 border border-slate-200 p-1.5 rounded-lg">
                            <input type="color" id="colorDark" value="#000000" class="w-6 h-6 rounded border-0 cursor-pointer">
                            <span id="hexDark" class="font-mono text-slate-600">#000000</span>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <span class="text-slate-500 block">背景色</span>
                        <div class="flex items-center space-x-2 border border-slate-200 p-1.5 rounded-lg">
                            <input type="color" id="colorLight" value="#ffffff" class="w-6 h-6 rounded border-0 cursor-pointer">
                            <span id="hexLight" class="font-mono text-slate-600">#ffffff</span>
                        </div>
                    </div>
                </div>

                <!-- 容错率选择 -->
                <div class="space-y-1 text-xs">
                    <span class="text-slate-500 block">容错级别 (纠错能力)</span>
                    <select id="correctLevel" class="w-full p-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 text-xs">
                        <option value="L">低 (L - 7%)</option>
                        <option value="M" selected>中等 (M - 15%)</option>
                        <option value="Q">较高 (Q - 25%)</option>
                        <option value="H">最高 (H - 30%)</option>
                    </select>
                </div>
            </div>

            <hr class="border-slate-100">

            <!-- 3. 下载导出按钮 -->
            <button id="downloadBtn" class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl shadow-md transition flex items-center justify-center space-x-2 cursor-pointer">
                <span>📥 导出二维码图片 (PNG)</span>
            </button>
        </div>

        <!-- 右侧：二维码展示区 -->
        <div class="lg:col-span-2 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-center items-center min-h-[400px] relative">
            
            <div class="w-full h-full flex flex-col items-center justify-center rounded-xl p-6 bg-slate-100/50 border border-slate-200/60 space-y-4">
                
                <!-- 二维码容器 -->
                <div id="qrcode" class="p-4 bg-white rounded-xl shadow-md border border-slate-200 transition-all flex items-center justify-center"></div>

                <!-- 提示信息 -->
                <p class="text-xs text-slate-400 font-mono text-center" id="statusText">实时预览中 · 扫码即可识别</p>
            </div>
        </div>
    </main>

    <script>
        // DOM 元素引用
        const qrText = document.getElementById('qrText');
        const sizeSlider = document.getElementById('sizeSlider');
        const valSize = document.getElementById('valSize');
        const colorDark = document.getElementById('colorDark');
        const colorLight = document.getElementById('colorLight');
        const hexDark = document.getElementById('hexDark');
        const hexLight = document.getElementById('hexLight');
        const correctLevel = document.getElementById('correctLevel');
        const downloadBtn = document.getElementById('downloadBtn');
        const qrContainer = document.getElementById('qrcode');

        let qrcodeObj = null;

        // 获取纠错等级
        function getCorrectLevel(levelStr) {
            switch(levelStr) {
                case 'L': return QRCode.CorrectLevel.L;
                case 'M': return QRCode.CorrectLevel.M;
                case 'Q': return QRCode.CorrectLevel.Q;
                case 'H': return QRCode.CorrectLevel.H;
                default: return QRCode.CorrectLevel.M;
            }
        }

        // 核心渲染逻辑
        function generateQRCode() {
            const text = qrText.value.trim();
            const size = parseInt(sizeSlider.value);
            
            // 清空旧二维码
            qrContainer.innerHTML = '';

            if (!text) {
                qrContainer.innerHTML = '<span class="text-xs text-slate-400">请输入文本内容生成二维码</span>';
                downloadBtn.disabled = true;
                downloadBtn.classList.add('opacity-50', 'cursor-not-allowed');
                return;
            }

            downloadBtn.disabled = false;
            downloadBtn.classList.remove('opacity-50', 'cursor-not-allowed');

            // 实例化 QRCode
            qrcodeObj = new QRCode(qrContainer, {
                text: text,
                width: size,
                height: size,
                colorDark: colorDark.value,
                colorLight: colorLight.value,
                correctLevel: getCorrectLevel(correctLevel.value)
            });
        }

        // 监听文本输入
        qrText.addEventListener('input', generateQRCode);

        // 监听尺寸滑动
        sizeSlider.addEventListener('input', () => {
            valSize.innerText = `${sizeSlider.value} x ${sizeSlider.value} px`;
            generateQRCode();
        });

        // 监听颜色变化
        colorDark.addEventListener('input', (e) => {
            hexDark.innerText = e.target.value;
            generateQRCode();
        });

        colorLight.addEventListener('input', (e) => {
            hexLight.innerText = e.target.value;
            generateQRCode();
        });

        // 监听容错等级切换
        correctLevel.addEventListener('change', generateQRCode);

        // 导出下载 PNG
        downloadBtn.addEventListener('click', () => {
            // QRCode.js 会在容器内生成 img 或 canvas
            const img = qrContainer.querySelector('img');
            const canvas = qrContainer.querySelector('canvas');

            let imageSrc = '';
            if (img && img.src) {
                imageSrc = img.src;
            } else if (canvas) {
                imageSrc = canvas.toDataURL('image/png');
            }

            if (!imageSrc) return;

            const link = document.createElement('a');
            link.download = `qrcode-${Date.now()}.png`;
            link.href = imageSrc;
            link.click();
        });

        // 初始化第一次渲染
        generateQRCode();
    </script>
</body>
</html>
